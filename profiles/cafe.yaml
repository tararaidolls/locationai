  W: {W1: 2, W2: 1, W3: 1}
  A: {A1: 1, A2: 2, A3: 2}
  C: {C1: 1, C2: 1, C4: 2}
  S: {S1: 1}
caps:
  - {dimension: A, below: 10, max: 50}
